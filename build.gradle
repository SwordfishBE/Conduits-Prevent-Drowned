plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories {
    mavenCentral()
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Optional client mod for local development; never bundled or required on servers.
    localRuntime("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'conduits_prevent_drowned-test'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}
jar { from('LICENSE') { rename { "LICENSE_${project.archives_base_name}" } } }
